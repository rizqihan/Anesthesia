<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="540" height="360">
  <defs>
    <filter id="speckle" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.45" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.18 0" result="speckle" />
      <feComposite in2="SourceGraphic" in="speckle" operator="over" />
    </filter>
    <linearGradient id="sectorCone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1220" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#050a14" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="liverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243044" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="thrombusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="stomachFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#64748b" />
      <stop offset="80%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background Monitor Frame -->
  <rect width="540" height="360" fill="#030712" />

  <!-- Ultrasound Machine Header HUD -->
  <g font-family="monospace, ui-monospace, sans-serif" font-size="11" fill="#94a3b8">
    <rect x="0" y="0" width="540" height="32" fill="#090d16" />
    <text x="14" y="20" font-weight="bold" fill="#38bdf8">BLUE Protocol - Pathognomonic Lung Point Transition</text>
    <text x="300" y="20" fill="#cbd5e1">L12-4 Linear M-Mode</text>
    <text x="450" y="20" fill="#94a3b8">FPS: 38Hz</text>
  </g>

  <!-- Main Scan Viewport Area -->
  <g transform="translate(0, 32)">
    
    <!-- Split M-mode trace with Lung Point boundary -->
    <rect x="40" y="20" width="460" height="280" fill="#030712" stroke="#1e293b" stroke-width="1.5" />
    <!-- Upper B-mode window -->
    <g transform="translate(0, 0)">
      <rect x="40" y="20" width="460" height="100" fill="#050a14" />
      <line x1="40" y1="75" x2="500" y2="75" stroke="#ffffff" stroke-width="3" />
      <!-- Left side: Normal sliding shimmering dots -->
      <text x="80" y="55" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">NORMAL SLIDING ZONE</text>
      <!-- Right side: Pneumothorax motionless -->
      <text x="320" y="55" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold">PNEUMOTHORAX ZONE</text>
      <!-- Lung Point M-mode cursor line -->
      <line x1="270" y1="20" x2="270" y2="120" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2" />
      <polygon points="265,20 275,20 270,30" fill="#f59e0b" />
    </g>
    <!-- Lower M-mode trace -->
    <g transform="translate(0, 125)">
      <rect x="40" y="0" width="460" height="175" fill="#000000" />
      <!-- Left half: Granular Seashore Pattern (aerated lung in inspiration) -->
      <rect x="40" y="50" width="230" height="125" fill="#1e293b" opacity="0.4" />
      <line x1="40" y1="50" x2="270" y2="50" stroke="#38bdf8" stroke-width="2" />
      <!-- Waves on beach lines above pleural line -->
      <line x1="40" y1="15" x2="270" y2="15" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="40" y1="30" x2="270" y2="30" stroke="#94a3b8" stroke-width="1.5" />
      <text x="80" y="110" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">SEASHORE SIGN</text>
      <!-- Right half: Horizontal Barcode / Stratosphere Pattern (pneumothorax) -->
      <line x1="270" y1="15" x2="500" y2="15" stroke="#f87171" stroke-width="1.5" />
      <line x1="270" y1="35" x2="500" y2="35" stroke="#f87171" stroke-width="1.5" />
      <line x1="270" y1="55" x2="500" y2="55" stroke="#f87171" stroke-width="1.5" />
      <line x1="270" y1="75" x2="500" y2="75" stroke="#f87171" stroke-width="1.5" />
      <line x1="270" y1="95" x2="500" y2="95" stroke="#f87171" stroke-width="1.5" />
      <line x1="270" y1="115" x2="500" y2="115" stroke="#f87171" stroke-width="1.5" />
      <line x1="270" y1="135" x2="500" y2="135" stroke="#f87171" stroke-width="1.5" />
      <line x1="270" y1="155" x2="500" y2="155" stroke="#f87171" stroke-width="1.5" />
      <text x="310" y="110" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="bold">BARCODE SIGN</text>
      <!-- Dividing Vertical Line: LUNG POINT -->
      <line x1="270" y1="0" x2="270" y2="175" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 3" />
      <text x="215" y="30" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">LUNG POINT (100% SPECIFIC)</text>
    </g>
  
  </g>

  <!-- Depth Scale Calibration Ruler (Right Margin) -->
  <g font-family="monospace, sans-serif" font-size="9" fill="#64748b" text-anchor="end">
    <line x1="524" y1="45" x2="524" y2="335" stroke="#334155" stroke-width="1.5" />
    <line x1="518" y1="45" x2="524" y2="45" stroke="#94a3b8" stroke-width="1.5" />
    <text x="514" y="48">0</text>
    <line x1="520" y1="100" x2="524" y2="100" stroke="#64748b" stroke-width="1" />
    <text x="514" y="103">4</text>
    <line x1="518" y1="155" x2="524" y2="155" stroke="#94a3b8" stroke-width="1.5" />
    <text x="514" y="158">8</text>
    <line x1="520" y1="210" x2="524" y2="210" stroke="#64748b" stroke-width="1" />
    <text x="514" y="213">12</text>
    <line x1="518" y1="265" x2="524" y2="265" stroke="#94a3b8" stroke-width="1.5" />
    <text x="514" y="268">6cm</text>
  </g>

  <!-- Status Bar Footer -->
  <g font-family="monospace, sans-serif" font-size="9" fill="#64748b">
    <text x="14" y="352">GAIN: 58dB • MI: 1.1 • TIS: 0.3 • CLINICAL POCUS REFERENCE</text>
  </g>
</svg>